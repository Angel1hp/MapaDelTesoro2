<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mapa del Tesoro</title>
    <link rel="stylesheet" href="css/yacolca.css">
</head>

<body>

    <h1 id="blink">Encuentra el tesoro</h1>

    <img src="img/MapadeTesoro.png" width="400" height="400" id="map" draggable="false">

    <p id="distance"></p>

    <button type="button" id="fullscreen-btn">
        Pantalla completa
    </button>

    <script type="text/javascript">

        window.setInterval(BlinkIt, 500);

        var color = "red";

        function BlinkIt() {

            var blink = document.getElementById("blink");

            color = (color == "#ffffff") ? "red" : "#ffffff";

            blink.style.color = color;
            blink.style.fontSize = '36px';

        }

    </script>

    <script src="js/helper.js" charset="utf-8"></script>
    <script src="js/game.js" charset="utf-8"></script>

</body>

</html>
